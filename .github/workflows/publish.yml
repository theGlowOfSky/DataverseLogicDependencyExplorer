
name: Publish Dataverse Logic Dependency Explorer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, Test and Publish
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup NuGet CLI
        uses: NuGet/setup-nuget@v2

      - name: Build, test and package
        shell: pwsh
        run: |
          ./build/Package-Plugin.ps1

      - name: Locate NuGet package
        id: package
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -Path "./artifacts" -Filter "*.nupkg" -File)

          if ($packages.Count -ne 1) {
              throw "Expected exactly one NuGet package in artifacts. Found: $($packages.Count)"
          }

          "package_path=$($packages[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Authenticate with NuGet Trusted Publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: glowofsky

      - name: Publish package to NuGet.org
        shell: pwsh
        run: |
          dotnet nuget push "${{ steps.package.outputs.package_path }}" `
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source "https://api.nuget.org/v3/index.json"
